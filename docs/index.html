<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0F261D"><title>EnviroRock | Content Partnership</title>
<style>
:root{--accent:#2A7150;--hover:#54D99B;--deep:#0F261D;--deep2:#1B3B2D;--ink:#15251E;--muted:#66746D;--paper:#F5F7F3;--cream:#F2F6E7;--line:#DFE7DF;--fontsize:16px}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:var(--fontsize)/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button{font:inherit;cursor:pointer}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--deep);color:#e9f0e9;padding:28px 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.logo{display:block;width:202px;max-width:100%;height:auto;margin-bottom:45px}.logo-fallback{width:100%;max-width:205px;background:#2A7150;color:white;padding:9px 10px;font-size:22px;font-weight:800;line-height:1.05;margin-bottom:45px}.logo-fallback small{font-size:8px;display:block;font-weight:400;letter-spacing:.2px}.nav-caption,.eyebrow{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--accent)}.nav-caption{color:#8bb2a1;margin:12px 8px 18px}.sidebar button{border:0;background:none;color:#ccded5;text-align:left;border-radius:9px;padding:13px 12px;margin:3px 0;display:flex;justify-content:space-between;align-items:center;font-size:.85rem}.sidebar button.active,.sidebar button:hover{background:var(--accent);color:#fff}.sidefoot{margin-top:auto;font-size:.72rem;color:#a0c2af;border-top:1px solid #294438;padding-top:20px}.main{padding:40px clamp(24px,5vw,90px);max-width:1450px;width:100%;margin:auto}.hero{background:var(--deep);border-radius:22px;color:white;padding:clamp(28px,6vw,76px);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:320px;height:320px;border:2px solid #3d785a;border-radius:50%;right:-150px;top:-130px}.hero .eyebrow{color:#8dddb2}.hero h1{font-size:clamp(2.1rem,4.5vw,4.3rem);letter-spacing:-.045em;line-height:1.08;margin:15px 0 20px;max-width:900px}.hero p{font-size:1.13rem;color:#caddd2;max-width:760px}.tags{display:flex;gap:9px;flex-wrap:wrap;margin-top:30px}.tag{border:1px solid #5b806c;border-radius:40px;padding:5px 13px;font-size:.76rem}.topline{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:0 0 22px}.topline button,.toolbar button{border:1px solid var(--line);background:white;color:var(--deep);border-radius:9px;padding:9px 14px;font-weight:650}.chapter{margin:34px 0}.chapter h2{font-size:clamp(2rem,3.6vw,3.1rem);letter-spacing:-.04em;margin:8px 0}.chapter .lead{color:var(--muted);font-size:1.12rem;max-width:850px}.section{background:#fff;border:1px solid var(--line);border-radius:15px;margin:13px 0;overflow:hidden;break-inside:avoid}.section summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:15px;font-weight:750;font-size:1.06rem;padding:21px 25px;cursor:pointer}.section summary::-webkit-details-marker{display:none}.section summary:after{content:"+";color:var(--accent);font-size:1.35rem}.section[open] summary:after{content:"−"}.section .inside{padding:0 25px 23px;color:#42574c}.section ul{margin:0;padding-left:20px}.section li{margin:7px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.smallprint{margin:45px 0 20px;color:var(--muted);font-size:.75rem}.section:not([open]) .inside{display:none}.print-head{display:none}
@media(max-width:860px){.layout{display:block}.sidebar{height:auto;position:relative;padding:15px 18px}.sidebar .logo{width:150px;margin:0 0 10px}.logo-fallback{margin-bottom:10px}.sidebar nav{display:flex;gap:4px;overflow:auto}.sidebar button{flex-shrink:0}.nav-caption,.sidefoot{display:none}.main{padding:20px}.topline{flex-wrap:wrap}}
@page{size:A4;margin:14mm 15mm}
@media print{body{background:white;-webkit-print-color-adjust:exact;print-color-adjust:exact}.layout{display:block}.sidebar,.toolbar,.topline,.smallprint{display:none!important}.main{padding:0;max-width:none}.hero{border-radius:0;padding:24px;min-height:160px;page-break-after:always}.chapter{display:block!important;break-before:page;margin:0}.chapter h2{font-size:25pt}.section{box-shadow:none;break-inside:avoid;margin:10px 0}.section .inside,.section:not([open]) .inside{display:block!important}.section summary:after{display:none}.section summary{padding:12px 16px 6px}.section .inside{padding:0 16px 12px}.print-head{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:58px;margin:0 0 15px;border-bottom:2px solid var(--accent)}.print-head img{max-width:165px;max-height:60px;object-fit:contain}.print-label{font-size:10px;color:var(--muted)}}
</style></head><body>
<script id="site-data" type="application/json">{"content":{"meta":{"company":"EnviroRock","studio":"Barrett Creek Multimedia","status":"Working proposal","date":"October 29, 2026","intro":"A content partnership designed around an initial production and post-production sprint, followed by an ongoing monthly or quarterly content system.","tagline":"Build once. Publish with purpose."},"chapters":[{"id":"overview","number":"01","title":"The opportunity","lead":"A practical content system for the new EnviroRock website, paid media, organic social and technical education.","sections":[{"heading":"The current picture","body":"Mann Ventures is supporting the website and marketing strategy. The project needs a clear visual direction, updated brochures and installation materials, and useful technical answers. The mid-November website target mentioned in the meeting requires confirmation."},{"heading":"What we heard","bullets":["Start with a focused sprint using available project photography and video.","Create complementary new production featuring Sebastian.","Build reusable content, not only one-time campaign assets.","Plan for paid and organic distribution.","Align the visual treatment to EnviroRock’s green and grey brand."]},{"heading":"Immediate needs","body":"Obtain original photos and video from Liba (name to confirm), brochures, installation guide and Sketchfab files. Review a prior CBC reference and existing animations before scoping a refresh."}]},{"id":"pillars","number":"02","title":"Content pillars","lead":"A small number of repeatable editorial categories to support multiple channels.","sections":[{"heading":"Brand story","body":"Explain what lightweight foam glass aggregate is, where EnviroRock fits, and what problems the product helps solve. Adapt for the website, social media and sales materials."},{"heading":"Technical education","body":"Installation guidance, product explanation, technical FAQ, illustrations, animation and short content relevant to geotechnical audiences."},{"heading":"Project proof","body":"Use real applications, supplied project photos and videos, case studies, before/after examples and relevant construction outcomes."},{"heading":"Expert perspective","body":"Film Sebastian answering audience questions. Reformat longer interview sessions into short question-led excerpts, organic clips and targeted ads."},{"heading":"Distribution","bullets":["Website landing and product pages","Organic social series","Paid campaign variations","Sales conversations, lunch-and-learns and conference follow-up"]}]},{"id":"roadmap","number":"03","title":"Production roadmap","lead":"Start with usable assets, capture new evergreen material, then establish a planned production cadence.","sections":[{"heading":"Phase 01 / Post-production sprint","bullets":["Collect photos, videos, existing creative and collateral.","Review and shortlist usable files.","Confirm messaging with EnviroRock and Mann Ventures.","Produce priority initial edits and graphic updates."]},{"heading":"Phase 02 / Production + post","bullets":["Prepare interview questions and shot list.","Film Sebastian and supplemental product visuals.","Edit reusable segments and shorter social formats.","Build a source library for subsequent quarters."]},{"heading":"Phase 03 / Recurring partnership","bullets":["Schedule monthly editing and quarterly filming, or adjust cadence to campaign needs.","Maintain a backlog of audience questions and key messages.","Review content performance and refine the next cycle."]}]},{"id":"options","number":"04","title":"Scope options","lead":"Three starting frameworks. Final deliverables and quantities are subject to mutual agreement.","sections":[{"heading":"Option A — Post-first content sprint","body":"Initial review, repurposing, editing, graphic improvements and website-ready assets using existing footage. Production not included unless added."},{"heading":"Option B — Production + post sprint","body":"Focused interview or filming session with Sebastian, capture of supporting footage and edited modular deliverables. Labour and equipment are estimated separately."},{"heading":"Option C — Quarterly content partnership","body":"An ongoing editorial and production package with recurring editing, scheduled capture and flexible allocations for paid/organic content."},{"heading":"Estimating assumptions","bullets":["Specify filming dates, crew and equipment.","Define deliverable count, durations, aspect ratios, review rounds and raw-media handling.","Agree on rights, paid usage, approval timing and revision boundaries.","Confirm timing, taxes, travel and third-party expenses in the signed estimate."]}]},{"id":"next","number":"05","title":"Decisions & next steps","lead":"Confirm the inputs needed to turn this working outline into an agreed production package.","sections":[{"heading":"EnviroRock / Mann Ventures","bullets":["Send current brochures, install guide, Sketchfab animation and creative references.","Share project photos and video (Liba — confirm contact).","Confirm website launch requirements and key priorities.","Compile common geotechnical, conference and lunch-and-learn questions."]},{"heading":"Barrett Creek Multimedia","bullets":["Review supplied assets and assess immediate post-production scope.","Prepare interview questions and a filming approach for Sebastian.","Build itemized service and cadence scenarios using actual BCM SKUs.","Confirm review schedule and draft deliverable matrix."]},{"heading":"Open questions","bullets":["Who signs off on copy and creative?","Is the potential course intended for CPD accreditation or informal training?","Which assets or reference examples are already approved?","Which distribution channel is first priority?"]}]}]},"branding":{"accent":"#2A7150","accentHover":"#54D99B","deep":"#0F261D","deep2":"#1B3B2D","ink":"#15251E","muted":"#66746D","paper":"#F5F7F3","cream":"#F2F6E7","line":"#DFE7DF","font":"system","fontSize":16,"logoWidth":202,"logoPadTop":0,"logoPadLeft":0,"logoData":"data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20962%20385%22%20role%3D%22img%22%20aria-labelledby%3D%22title%22%3E%3Ctitle%20id%3D%22title%22%3EEnviroRock%3C%2Ftitle%3E%3Cpath%20fill%3D%22%23267451%22%20d%3D%22M0%2080%20505%205%20962%2079%20962%20321%20467%20382%200%20324Z%22%2F%3E%3Cpath%20fill%3D%22%23b5b5b5%22%20d%3D%22M550%2019%20962%2079%20962%20321%20389%20369Z%22%2F%3E%3Ctext%20x%3D%2231%22%20y%3D%22198%22%20font-family%3D%22Arial%2CHelvetica%2Csans-serif%22%20fill%3D%22%23fff%22%20font-size%3D%22133%22%20font-weight%3D%22700%22%20letter-spacing%3D%22-7%22%3EENVIRO-ROCK%3C%2Ftext%3E%3Ctext%20x%3D%2235%22%20y%3D%22284%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2CHelvetica%2Csans-serif%22%20font-size%3D%2243%22%20font-weight%3D%22400%22%3ELIGHT%20WEIGHT%20FOAM%20GLASS%20AGGREGATE%3C%2Ftext%3E%3C%2Fsvg%3E"}}</script>
<div class="layout"><aside class="sidebar"><div id="sidebar-logo"></div><div class="nav-caption">PRESENTATION</div><nav id="nav"></nav><div class="sidefoot">Working proposal · subject to approval</div></aside>
<main class="main"><div class="topline"><span class="eyebrow">Barrett Creek Multimedia / EnviroRock</span><div class="toolbar"><button id="expand">Expand all</button><button id="print">Print full proposal / PDF</button></div></div>
<div class="hero"><span class="eyebrow">Content partnership / Proposal</span><h1 id="hero-title"></h1><p id="hero-desc"></p><div class="tags"><span class="tag">Website launch</span><span class="tag">Paid + organic</span><span class="tag">Monthly / quarterly</span></div></div>
<div id="chapters"></div><div class="smallprint" id="disclaimer"></div></main></div>
<script>
(()=>{'use strict';
const state=JSON.parse(document.getElementById('site-data').textContent);
const c=state.content,b=state.branding;const root=document.documentElement;
const css={accent:'--accent',accentHover:'--hover',deep:'--deep',deep2:'--deep2',ink:'--ink',muted:'--muted',paper:'--paper',cream:'--cream',line:'--line'};
Object.entries(css).forEach(([k,v])=>root.style.setProperty(v,b[k]));root.style.setProperty('--fontsize',(Number(b.fontSize)||16)+'px');
if(b.font==='serif')document.body.style.fontFamily='Georgia,Times New Roman,serif';
if(b.font==='mono')document.body.style.fontFamily='Consolas,monospace';
function el(tag,cls,text){let n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function logo(){if(b.logoData){const i=el('img','logo');i.src=b.logoData;i.alt='EnviroRock';i.style.width=(b.logoWidth||202)+'px';i.style.paddingTop=(b.logoPadTop||0)+'px';i.style.paddingLeft=(b.logoPadLeft||0)+'px';return i}
const d=el('div','logo-fallback','ENVIRO-ROCK');d.append(el('small',null,'LIGHT WEIGHT FOAM GLASS AGGREGATE'));return d}
document.getElementById('sidebar-logo').append(logo());document.getElementById('hero-title').textContent=c.meta.tagline;document.getElementById('hero-desc').textContent=c.meta.intro;document.getElementById('disclaimer').textContent=c.meta.status+' · All scope, rates, deliverables and dates require written approval.';
const nav=document.getElementById('nav'),wrap=document.getElementById('chapters');
for(let ch of c.chapters){const btn=el('button',null,ch.title);btn.dataset.target=ch.id;btn.append(el('span',null,ch.number));nav.append(btn);
const page=el('section','chapter');page.id=ch.id;
const ph=el('div','print-head');ph.append(logo(),el('span','print-label',c.meta.company+' / '+c.meta.studio));page.append(ph,el('div','eyebrow',ch.number+' / Content strategy'),el('h2',null,ch.title),el('p','lead',ch.lead));
for(const s of ch.sections){const dt=el('details','section');dt.open=true;const sum=el('summary',null,s.heading),inside=el('div','inside');if(s.body)inside.append(el('p',null,s.body));if(s.bullets){const ul=el('ul');for(const q of s.bullets)ul.append(el('li',null,q));inside.append(ul)}dt.append(sum,inside);page.append(dt)}wrap.append(page);
btn.onclick=()=>{document.querySelectorAll('.chapter').forEach(p=>p.style.display=p===page?'block':'none');document.querySelectorAll('.sidebar button').forEach(x=>x.classList.toggle('active',x===btn));window.scrollTo({top:0,behavior:'instant'})};
}
const cover=document.querySelector('.hero');
if(cover && wrap.firstElementChild) wrap.firstElementChild.insertBefore(cover,wrap.firstElementChild.firstChild);
nav.firstElementChild.click();
document.getElementById('expand').onclick=()=>{let items=[...document.querySelectorAll('.chapter:not([style*="display: none"]) details')];let open=items.some(x=>!x.open);items.forEach(x=>x.open=open)};
document.getElementById('print').onclick=()=>{const old=[...document.querySelectorAll('.chapter')].map(x=>x.style.display);document.querySelectorAll('.chapter').forEach(x=>x.style.display='block');document.querySelectorAll('details').forEach(x=>x.open=true);window.print();document.querySelectorAll('.chapter').forEach((x,i)=>x.style.display=old[i])};
window.addEventListener('beforeprint',()=>{document.querySelectorAll('.chapter').forEach(x=>x.style.setProperty('display','block','important'));document.querySelectorAll('details').forEach(x=>x.open=true)});
window.addEventListener('afterprint',()=>{const active=document.querySelector('.sidebar button.active');if(active)active.click()});
})();
</script></body></html>
